[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pxray"
version = "0.1.0"
description = "Pneumonia chest X-ray CNN study on PneumoniaMNIST: honest evaluation, calibration and explainability (research exercise, not a diagnostic tool)"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "pillow",
  "torch",
  "torchvision",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
pxray = "pxray.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the downloaded PneumoniaMNIST file (skipped when absent)"]
